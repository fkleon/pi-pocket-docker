# Docker/Podman resolve service names internally; external A queries are
# intercepted and return the gateway address. The gateway uses the runtime's
# own upstream resolver and must not point its DNS back at this listener.
dns:
  enabled: true
  listen: "172.28.0.11:53"
  proxy_ip: "172.28.0.11"

proxy:
  # Intercept direct HTTP(S) as well as clients using the explicit proxy.
  http_listen: "172.28.0.11:80"
  https_listen: "172.28.0.11:443"
  tunnel_listen: ":8888"
  max_request_body_bytes: 1048576

tls:
  mode: "mitm"
  ca_cert: "/etc/ssl/certs/iron-proxy.pem"
  ca_key: "/run/iron-proxy/ca.key"
  cert_cache_size: 1000
  leaf_cert_expiry_hours: 72

transforms:
  - name: allowlist
    config:
      # HTTP(S) policy is enforced here, not by the DNS listener.
      # Add method/path restrictions as provider requirements are audited.
      domains:
        - "radius.earendil.com"
        - "radius.pi.dev"
        - "pi.dev"
        - "github.com"
        - "github.githubassets.com"
        - "raw.githubusercontent.com"
        - "api.github.com"
        - "api.individual.githubcopilot.com"
        - "git.home.leonhardt.co.nz"
        - "api.typesafe.ai"

  - name: secrets
    config:
      secrets:
        - source:
            type: file
            path: /run/secrets/iron-proxy
            json_key: TYPESAFE_API_KEY
          replace:
            proxy_value: proxy-typesafe-abc123
            match_headers: [Authorization]
          rules:
            - host: api.typesafe.ai
              require_tls: true

log:
  level: "info"
