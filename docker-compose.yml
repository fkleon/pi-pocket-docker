name: pi-pocket

# Hardened service configuration template
x-hardened: &hardened # Read-only root filesystem
  read_only: true
  # Run as nobody user
  user: "65534:65534"
  # Drop all capabilities
  cap_drop: [ALL]
  # Prevent privilege escalation
  security_opt:
    - no-new-privileges=true
  pids_limit: 256
  restart: unless-stopped

# Shared proxy environment for internal services with custom environment values.
x-internal-environment: &internal-environment
  HTTP_PROXY: http://gateway:8888
  HTTPS_PROXY: http://gateway:8888
  NO_PROXY: "localhost,127.0.0.1,172.28.0.10,app,gateway,chrome"

# Internal service configuration template
x-internal: &internal
  depends_on:
    dns-forwarder:
      condition: service_healthy
  dns:
    - 172.28.0.11
  networks:
    internal:

networks:
  # The internal network is used for communication between internal services,
  # and does not have direct access to the internet.
  internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # The edge network allows egress traffic to the internet.
  edge:
    enable_ipv6: false
  # The frontend network allows ingress traffic.
  frontend:
    enable_ipv6: false

configs:
  dnsmasq_conf:
    file: ./docker/dnsmasq.conf
  iron_proxy_conf:
    file: ./docker/iron-proxy.yaml
  iron_proxy_ca_cert:
    file: ./docker/iron-proxy-ca.crt
  ingress_conf:
    file: ./docker/nginx.conf

secrets:
  iron_proxy_ca_key:
    file: ./secrets/iron-proxy/ca.key

services:
  # The internal gateway service that handles egress through iron-proxy.
  # Its CA key is available only here; domain policy lives in iron-proxy.yaml.
  gateway:
    <<: [*hardened, *internal]
    image: ironsh/iron-proxy:0.56.0@sha256:727da0cc35a6d73ed2913a38d56c4b9b4476c075149492e4fbf75552e83361ff
    command: ["-config", "/etc/iron-proxy.yaml"]
    configs:
      - source: iron_proxy_conf
        target: /etc/iron-proxy.yaml
      - source: iron_proxy_ca_cert
        target: /etc/iron-proxy-ca.crt
    secrets:
      - source: iron_proxy_ca_key
        target: iron-proxy-ca.key
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      internal:
      edge:

  # The DNS forwarder service that handles internal DNS resolution.
  # Allowed domains must be allowlisted in the dnsmasq config file.
  dns-forwarder:
    <<: *hardened
    build:
      context: ./docker
      dockerfile: dnsmasq.Dockerfile
    image: local/dnsmasq:latest
    configs:
      - source: dnsmasq_conf
        target: /etc/dnsmasq.conf
    healthcheck:
      test: ["CMD-SHELL", "dnsmasq --test"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.1
    networks:
      internal:
        ipv4_address: 172.28.0.11
      edge:

  chrome:
    <<: [*hardened, *internal]
    build:
      context: ./docker
      dockerfile: chrome.Dockerfile
    image: local/pi-pocket-chrome:latest
    # Run with init to reap zombie processes
    init: true
    environment:
      <<: *internal-environment
      HOME: /tmp
    command:
      - --disable-gpu
      - --user-data-dir=/tmp/chrome
      - --proxy-server=http://gateway:8888
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    mem_limit: 2g
    cpus: 1.0
    shm_size: 1g
    expose:
      - "9222"
    networks:
      internal:
        ipv4_address: 172.28.0.10
    volumes:
      - pi-workspace:/workspace:ro

  app:
    <<: [*hardened, *internal]
    build:
      context: ./
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: 26
    image: local/pi-pocket:${PI_POCKET_VERSION:-latest}
    user: nonroot:nonroot
    environment:
      <<: *internal-environment
      # Egress config
      NODE_USE_ENV_PROXY: 1
      # App config
      PI_POCKET_BROWSER_URL: http://chrome:9222
      #PI_POCKET_BROWSER_URL: http://172.28.0.10:9222
      #PI_POCKET_BROWSER_URL: ws://172.28.0.10:9223
      PI_POCKET_GUARD: off
      PI_POCKET_PORT: 8787
      # Pi Pocket config (persistent data)
      PI_POCKET_DIR: /home/nonroot/.pi-pocket
      # Pi config (sign-ins, models, skills)
      PI_CODING_AGENT_DIR: /home/nonroot/.pi/agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: 2
    depends_on:
      gateway:
        condition: service_healthy
      chrome:
        condition: service_started
    expose:
      - "8787"
    volumes:
      - pi-home:/home/nonroot
      - pi-data:/home/nonroot/.pi:rw # Needs write access to agent.json.lock
      - pi-pocket-data:/home/nonroot/.pi-pocket
      - pi-workspace:/workspace

  # Optional interactive Pi CLI, sharing sign-ins and workspace with Pi Pocket.
  agent:
    <<: [*hardened, *internal]
    image: local/pi-agent:${PI_AGENT_VERSION:-latest}
    profiles:
      - agent
    build:
      context: ./docker
      dockerfile: pi-agent.Dockerfile
      args:
        VERSION: ${PI_AGENT_VERSION}
        CHECKSUM: ${PI_AGENT_CHECKSUM}
    user: nonroot:nonroot
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      <<: *internal-environment
      PI_CODING_AGENT_DIR: /home/nonroot/.pi/agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 512m
    cpus: 1
    volumes:
      - pi-home:/home/nonroot
      - pi-data:/home/nonroot/.pi
      - pi-workspace:/workspace
    working_dir: /workspace

  ingress:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:alpine
    configs:
      - source: ingress_conf
        target: /etc/nginx/conf.d/default.conf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "8787:8787"
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      - app
    networks:
      - frontend
      - internal

volumes:
  pi-home:
  pi-pocket-data:
  pi-data:
  pi-workspace:
