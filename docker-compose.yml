name: pi-pocket

# All services use the same generated system trust store, including public roots.
x-ca-environment: &ca-environment
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/iron-proxy.pem

x-ca-certs: &ca-certs
  type: volume
  source: ca-public
  target: /etc/ssl/certs
  read_only: true
  volume:
    nocopy: true

# Hardened service configuration template
x-hardened: &hardened # Read-only root filesystem
  read_only: true
  # Each image defines a non-root account named user.
  user: "user:user"
  # Drop all capabilities
  cap_drop: [ALL]
  # Prevent privilege escalation
  security_opt:
    - no-new-privileges=true
  pids_limit: 256
  restart: unless-stopped
  environment: *ca-environment

# Shared proxy environment for internal services with custom environment values.
x-internal-environment: &internal-environment
  <<: *ca-environment
  HTTP_PROXY: http://gateway:8888
  HTTPS_PROXY: http://gateway:8888
  NO_PROXY: "localhost,127.0.0.1,172.28.0.10,app,gateway,chrome"

# Internal service configuration template
x-internal: &internal
  depends_on:
    gateway:
      condition: service_healthy
  dns:
    - 172.28.0.11
  networks:
    internal:

secrets:
  iron-proxy:
    file: proxy-secrets.json

networks:
  # The internal network is used for communication between internal services,
  # and does not have direct access to the internet.
  internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # The edge network allows egress traffic to the internet.
  edge:
    enable_ipv6: false
  # The frontend network allows ingress traffic.
  frontend:
    enable_ipv6: false

configs:
  iron_proxy_conf:
    file: ./docker/iron-proxy.yaml
  ingress_conf:
    file: ./docker/nginx.conf

services:
  # One-shot, persistent CA creation and publication of the public trust store.
  ca-init:
    build:
      context: ./docker
      dockerfile: ca-init.Dockerfile
    image: local/pi-pocket-ca-init:latest
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    restart: "no"
    environment:
      IRON_PROXY_CA_DAYS: ${IRON_PROXY_CA_DAYS:-3650}
      IRON_PROXY_CA_SUBJECT: ${IRON_PROXY_CA_SUBJECT:-/CN=Pi Pocket Iron Proxy CA}
    volumes:
      - ca-private:/ca-private
      - ca-public:/ca-public

  # Own the named workspace before Chrome can mount it read-only. App and
  # agent use the same build-time UID/GID; this service never mounts host binds.
  workspace-init:
    build:
      context: ./docker
      dockerfile: workspace-init.Dockerfile
    image: local/pi-pocket-workspace-init:latest
    user: ${APP_UID:-10001}:${APP_GID:-10001}
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges=true
    restart: "no"
    volumes:
      - pi-workspace:/workspace

  # The internal gateway service that handles egress through iron-proxy.
  # Its CA key is available only here; domain policy lives in iron-proxy.yaml.
  gateway:
    # Do not inherit the client DNS setting: the gateway must resolve upstream
    # hosts using the runtime's resolver, not its own interception listener.
    <<: *hardened
    build:
      context: ./docker
      dockerfile: gateway.Dockerfile
      args:
        VERSION: 0.59.0
    image: local/pi-pocket-gateway:latest
    command: ["-config", "/etc/iron-proxy.yaml"]
    configs:
      - source: iron_proxy_conf
        target: /etc/iron-proxy.yaml
    volumes:
      - *ca-certs
      - ca-private:/run/iron-proxy:ro
    depends_on:
      ca-init:
        condition: service_completed_successfully
    # Allow this non-root process to bind DNS and transparent HTTP(S) ports
    # without adding capabilities. This sysctl is scoped to its network namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp
    secrets:
      - iron-proxy
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "nslookup -type=A healthcheck.invalid 172.28.0.11 | awk '/^Name:/{seen=1;next} seen && /^Address:[[:space:]]*172[.]28[.]0[.]11$/{ok=1} END{exit !ok}' && wget -q -O /dev/null http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      internal:
        ipv4_address: 172.28.0.11
      edge:

  chrome:
    <<: [*hardened, *internal]
    build:
      context: ./docker
      dockerfile: chrome.Dockerfile
      args:
        APP_UID: 10002
        APP_GID: 10002
    image: local/pi-pocket-chrome:latest
    depends_on:
      gateway:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    # The browser can read group-readable files in the read-only workspace.
    group_add:
      - "${APP_GID:-10001}"
    # Run with init to reap zombie processes
    init: true
    environment:
      <<: *internal-environment
    command:
      - --disable-gpu
      - --user-data-dir=/home/user/chrome
      - --proxy-server=http://gateway:8888
    tmpfs:
      - /home/user/chrome:rw,noexec,nosuid,size=256m,uid=10002,gid=10002,mode=0700
      - /var/cache/fontconfig:rw,noexec,nosuid,size=128m,uid=10002,gid=10002,mode=0700
    mem_limit: 2g
    cpus: 1.0
    shm_size: 1g
    expose:
      - "9222"
    networks:
      internal:
        ipv4_address: 172.28.0.10
    volumes:
      - *ca-certs
      - pi-workspace:/workspace:ro
      - chrome-nssdb:/home/user/.local/share/pki/nssdb

  app:
    <<: [*hardened, *internal]
    build:
      context: ./
      dockerfile: docker/app.Dockerfile
      args:
        NODE_VERSION: 26
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/pi-pocket:${PI_POCKET_VERSION:-latest}
    environment:
      <<: *internal-environment
      UMASK: 0002
      # Egress config
      NODE_USE_ENV_PROXY: 1
      NODE_OPTIONS: "--use-system-ca"
      # App config
      PI_POCKET_BROWSER_URL: http://chrome:9222
      #PI_POCKET_BROWSER_URL: http://172.28.0.10:9222
      #PI_POCKET_BROWSER_URL: ws://172.28.0.10:9223
      PI_POCKET_GUARD: off
      PI_POCKET_PORT: 8787
      # Pi Pocket config (persistent data)
      PI_POCKET_DIR: /home/user/.pi-pocket
      # Pi config (sign-ins, models, skills)
      PI_CODING_AGENT_DIR: /home/user/.pi/agent
      # API keys and credentials
      TYPESAFE_API_KEY: proxy-typesafe-abc123
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: 2
    depends_on:
      ca-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
      chrome:
        condition: service_started
    expose:
      - "8787"
    volumes:
      - *ca-certs
      - pi-home:/home/user
      - pi-data:/home/user/.pi:rw # Needs write access to agent.json.lock
      - pi-pocket-data:/home/user/.pi-pocket
      - pi-workspace:/workspace

  # Optional interactive Pi CLI, sharing sign-ins and workspace with Pi Pocket.
  agent:
    <<: [*hardened, *internal]
    image: local/pi-agent:${PI_AGENT_VERSION:-latest}
    profiles:
      - agent
    build:
      context: ./docker
      dockerfile: agent.Dockerfile
      args:
        VERSION: ${PI_AGENT_VERSION}
        CHECKSUM: ${PI_AGENT_CHECKSUM}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      <<: *internal-environment
      UMASK: 0002
      # Agent config
      PI_CODING_AGENT_DIR: /home/user/.pi/agent
      # API keys and credentials
      TYPESAFE_API_KEY: proxy-typesafe-abc123
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 512m
    cpus: 1
    depends_on:
      ca-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    volumes:
      - *ca-certs
      - pi-home:/home/user
      - pi-data:/home/user/.pi
      - pi-workspace:/workspace
    working_dir: /workspace

  ingress:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:alpine
    user: nginx:nginx
    volumes:
      - *ca-certs
    configs:
      - source: ingress_conf
        target: /etc/nginx/conf.d/default.conf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "8787:8787"
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      - app
    networks:
      - frontend
      - internal

volumes:
  ca-private:
  ca-public:
  chrome-nssdb:
  pi-home:
  pi-pocket-data:
  pi-data:
  pi-workspace:
    driver: local
    driver_opts:
      type: none
      device: ${PI_WORKSPACE_DIR:-./workspace}
      o: bind
